<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% if page.title %}{{ page.title }} · {% endif %}K-Management Limited</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}" />
  <link rel="canonical" href="{{ page.url | absolute_url }}" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="K-Management Limited" />
  <meta property="og:title" content="{{ page.title | default: site.title | escape }}" />
  <meta property="og:description" content="{{ page.description | default: site.description | escape }}" />
  <meta property="og:url" content="{{ page.url | absolute_url }}" />
  <meta name="twitter:card" content="summary" />
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}" />
</head>
<body>
  {% include nav.html %}
  <main>
    {{ content }}
  </main>
  {% include footer.html %}
  <script defer src="{{ '/assets/js/site.js' | relative_url }}"></script>
</body>
</html>
